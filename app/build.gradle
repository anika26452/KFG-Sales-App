plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 31
    buildToolsVersion "30.0.3"

    defaultConfig {
     //   applicationId 'com.sysnova.kfg_sales_appv903'
        applicationId 'com.sysnova.kfg_sales_appv10'
        minSdkVersion 19
        targetSdkVersion 31
        versionCode 12
        versionName '9.03'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        //multiDexEnabled true //2022-08-20 added by Shanzida
    }
    //2022-08-20 added by Shanzida
    /*dexOptions {
        javaMaxHeapSize "4g"
    }*/
    //2022-08-20 end
    buildTypes {
        release {
            minifyEnabled false
            //crunchPngs false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.sysnova.kfg_sales_appv10'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation project(path: ':searchablespinnerlibrary')
    //implementation 'com.toptoche.searchablespinner:searchablespinnerlibrary:1.3.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    implementation files('libs/apache-httpcomponents-httpcore.jar')
    // implementation files('libs/ftp4j-1.7.jar')
    //implementation files('libs/gson-2.2.2.jar')
    implementation files('libs/httpclient-4.2.3.jar')
    //implementation files('libs/java-json.jar')
    implementation files('libs/picasso-2.5.2.jar')
    implementation files('libs/postgresql-9.1-901.jdbc3.jar')
    implementation'commons-logging:commons-logging-api:1.1'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation("androidx.annotation:annotation:1.3.0")
    implementation 'com.github.dhaval2404:imagepicker:2.1'
    implementation 'commons-codec:commons-codec:1.15'

}